<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reconoce la interfaz de Excel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;800&display=swap">
<style>
:root{--bg:#f2f6f3;--surface:#fff;--ink:#12261b;--muted:#4b5f54;--green:#1e6e42;--line:#c5d3ca;--ok:#157a38;--bad:#c0281b;--zone:#1e6e42;--zoneline:#bfe3cf;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1a14;--surface:#1a2a21;--ink:#e6f1ea;--muted:#9db3a5;--green:#3aa56b;--line:#2f4538;--ok:#4cd37f;--bad:#ff7466}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1a14;--surface:#1a2a21;--ink:#e6f1ea;--muted:#9db3a5;--green:#3aa56b;--line:#2f4538;--ok:#4cd37f;--bad:#ff7466}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Nunito Sans",system-ui,"Segoe UI",sans-serif}
main{max-width:1100px;margin:0 auto;padding:24px 16px 40px}
h1{font-size:1.7rem;line-height:1.2;margin:0 0 6px;font-weight:800}
.lead{margin:0 0 18px;color:var(--muted);max-width:68ch}
#bank{display:flex;flex-wrap:wrap;gap:10px;min-height:58px;padding:12px;border:2px dashed var(--line);border-radius:10px;background:var(--surface);margin-bottom:16px}
#bank:empty::after{content:"Todos los nombres están colocados.";color:var(--muted);align-self:center}
.chip{background:var(--surface);color:var(--ink);border:1.5px solid var(--green);border-radius:8px;padding:8px 14px;font-weight:600;cursor:grab;user-select:none;touch-action:manipulation}
.chip:focus-visible,.zone:focus-visible,button:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.chip.sel{outline:3px solid var(--green);outline-offset:2px;background:color-mix(in srgb,var(--green) 14%,var(--surface))}
.scroller{overflow-x:auto;border-radius:10px;border:1px solid var(--line);background:#000}
.stage{position:relative;min-width:880px;container-type:inline-size}
.stage img{display:block;width:100%;height:auto}
.zone{position:absolute;background:var(--zone);border:2px dashed var(--zoneline);border-radius:5px;padding:2px;cursor:pointer}
.zone.over{background:#2d8f58}
.zone .chip{width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 3px;line-height:1.1;font-size:clamp(8px,1.05cqw,15px);border-radius:3px;border-width:0;color:#12261b;background:#fff;cursor:grab}
.zone .chip.sel{background:#d5f0e1}
.zone.ok{border:3px solid var(--ok)}.zone.bad{border:3px solid var(--bad)}
.badge{position:absolute;top:-11px;right:-11px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;box-shadow:0 0 0 2px #fff;z-index:3}
.badge svg{width:14px;height:14px}
.ok .badge{background:#157a38}.bad .badge{background:#c0281b}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:16px}
button{font:inherit;font-weight:800;border:0;border-radius:8px;padding:11px 26px;background:var(--green);color:#fff;cursor:pointer}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button{color:#08140d}}
:root[data-theme="dark"] button{color:#08140d}
button:hover{filter:brightness(1.1)}
#count{color:var(--muted)}
#result{display:none;margin-top:16px;padding:16px 18px;border-radius:10px;background:var(--surface);border:2px solid var(--green)}
#result.show{display:block}
#result strong{font-size:1.3rem}
#result p{margin:4px 0 0;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){#result.show{animation:pop .25s ease-out}@keyframes pop{from{transform:scale(.97);opacity:0}}}
</style>
</head>
<body>
<main>
<h1>Reconoce la interfaz de Excel</h1>
<p class="lead">Arrastra cada nombre al recuadro verde que le corresponde. En el celular, toca el nombre y luego toca el recuadro. Cuando termines, pulsa «Terminar».</p>

<div class="bar"><button id="finish" type="button">Terminar</button><span id="count"></span></div>
<div id="result" role="status" aria-live="polite"></div>
</main>
<script>
var W=1366,H=702;
var LABELS={1:"Barra de acceso rápido",2:"Barra de fórmulas",3:"Columnas",4:"Filas",5:"Cinta de opciones",6:"Cuadro de nombres",7:"Celda activa",8:"Pestaña de hoja"};
var ZONES=[[1,20,2,217,46],[6,20,169,147,48],[7,88,260,127,47],[2,318,178,151,47],[5,434,126,105,48],[3,530,275,187,47],[4,27,414,151,47],[8,77,622,175,47]];
var stage=document.getElementById("stage"),bank=document.getElementById("bank"),result=document.getElementById("result"),btn=document.getElementById("finish"),countEl=document.getElementById("count");
var selected=null,dragged=null,done=false;
var OKSVG='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>';
var BADSVG='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
function pct(v,t){return (v/t*100).toFixed(3)+"%"}
function build(){
  done=false;selected=null;result.className="";result.innerHTML="";btn.textContent="Terminar";
  stage.querySelectorAll(".zone").forEach(function(z){z.remove()});
  bank.innerHTML="";
  ZONES.forEach(function(z){
    var d=document.createElement("div");d.className="zone";d.dataset.id=z[0];d.tabIndex=0;
    d.setAttribute("aria-label","Recuadro vacío");
    d.style.left=pct(z[1],W);d.style.top=pct(z[2],H);d.style.width=pct(z[3],W);d.style.height=pct(z[4],H);
    stage.appendChild(d);
  });
  var ids=Object.keys(LABELS);
  for(var i=ids.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=ids[i];ids[i]=ids[j];ids[j]=t}
  ids.forEach(function(id){
    var c=document.createElement("div");c.className="chip";c.draggable=true;c.tabIndex=0;c.dataset.id=id;c.setAttribute("role","button");c.textContent=LABELS[id];
    bank.appendChild(c);
  });
  updateCount();
}
function updateCount(){
  var n=stage.querySelectorAll(".zone .chip").length;
  countEl.textContent="Colocados: "+n+" de "+ZONES.length;
}
function select(c){if(selected)selected.classList.remove("sel");selected=c;if(c)c.classList.add("sel")}
function place(chip,target){
  if(target.classList.contains("zone")){
    var ex=target.querySelector(".chip");
    if(ex&&ex!==chip)bank.appendChild(ex);
    target.appendChild(chip);
  }else{bank.appendChild(chip)}
  select(null);updateCount();
}
document.addEventListener("click",function(e){
  if(e.target.closest("#finish"))return;
  if(done)return;
  var chip=e.target.closest(".chip"),zone=e.target.closest(".zone"),inBank=e.target.closest("#bank");
  if(selected){
    if(chip===selected){select(null);return}
    var target=zone||(inBank?bank:null);
    if(target){place(selected,target);return}
    if(chip)select(chip);
  }else if(chip){select(chip)}
});
document.addEventListener("keydown",function(e){
  if((e.key==="Enter"||e.key===" ")&&(e.target.classList.contains("chip")||e.target.classList.contains("zone"))){e.preventDefault();e.target.click()}
});
document.addEventListener("dragstart",function(e){
  var c=e.target.closest&&e.target.closest(".chip");
  if(!c||done){e.preventDefault();return}
  dragged=c;e.dataTransfer.setData("text/plain",c.dataset.id);e.dataTransfer.effectAllowed="move";
});
document.addEventListener("dragover",function(e){
  if(done||!dragged)return;
  var t=e.target.closest(".zone,#bank");
  if(t){e.preventDefault();if(t.classList.contains("zone"))t.classList.add("over")}
});
document.addEventListener("dragleave",function(e){var z=e.target.closest&&e.target.closest(".zone");if(z)z.classList.remove("over")});
document.addEventListener("drop",function(e){
  var t=e.target.closest(".zone,#bank");
  stage.querySelectorAll(".over").forEach(function(z){z.classList.remove("over")});
  if(!t||!dragged||done)return;
  e.preventDefault();place(dragged,t.id==="bank"?bank:t);dragged=null;
});
btn.addEventListener("click",function(){
  if(done){build();return}
  done=true;select(null);var ok=0;
  stage.querySelectorAll(".zone").forEach(function(z){
    var c=z.querySelector(".chip"),good=!!c&&c.dataset.id===z.dataset.id;
    if(c)c.draggable=false;
    z.classList.add(good?"ok":"bad");
    var b=document.createElement("span");b.className="badge";b.innerHTML=good?OKSVG:BADSVG;b.setAttribute("aria-label",good?"Correcto":"Incorrecto");
    z.appendChild(b);
    if(good)ok++;
  });
  var total=ZONES.length,msg;
  if(ok===total)msg="¡Perfecto! Reconoces todas las partes de la interfaz.";
  else if(ok>=total*0.6)msg="Vas muy bien. Revisa los recuadros marcados con ✗ e inténtalo de nuevo.";
  else msg="Repasa las partes de la interfaz e inténtalo de nuevo.";
  var vacios=stage.querySelectorAll(".zone:not(:has(.chip))").length;
  result.innerHTML="<strong>Total de aciertos: "+ok+" de "+total+"</strong><p>"+msg+(vacios?" Dejaste "+vacios+" sin responder.":"")+"</p>";
  result.className="show";
  btn.textContent="Intentar de nuevo";
  result.scrollIntoView({behavior:"smooth",block:"nearest"});
});
build();
</script>
</body>
</html>
